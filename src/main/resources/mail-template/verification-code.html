<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="x-apple-disable-message-reformatting">
  <title>Quiket 이메일 인증코드</title>
  <style>
    html,
    body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background: #ffffff;
    }

    * {
      -ms-text-size-adjust: 100%;
      -webkit-text-size-adjust: 100%;
      box-sizing: border-box;
    }

    table,
    td {
      mso-table-lspace: 0pt !important;
      mso-table-rspace: 0pt !important;
      border-collapse: collapse !important;
    }

    img {
      -ms-interpolation-mode: bicubic;
      border: 0;
      outline: none;
      text-decoration: none;
      display: block;
    }

    a {
      text-decoration: none;
    }

    @media screen and (max-width: 600px) {
      .email-container {
        width: 100% !important;
        max-width: 100% !important;
      }

      .header-cell {
        height: 220px !important;
        padding: 34px 28px 0 28px !important;
      }

      .logo {
        width: 58px !important;
        height: auto !important;
      }

      .header-title {
        font-size: 22px !important;
        line-height: 1.3 !important;
        letter-spacing: -0.6px !important;
        white-space: nowrap !important;
      }

      .character {
        width: 168px !important;
        height: auto !important;
        right: 25px !important;
        bottom: 0 !important;
      }

      .content-cell {
        padding: 36px 24px 0 24px !important;
      }

      .body-text {
        font-size: 15px !important;
        line-height: 1.75 !important;
      }

      .code-box {
        width: 196px !important;
        height: 72px !important;
      }

      .code-text {
        font-size: 24px !important;
        letter-spacing: 1px !important;
        white-space: nowrap !important;
        padding: 0 12px !important;
      }

      .footer-cell {
        padding: 56px 20px 18px 20px !important;
      }
    }

    @media screen and (max-width: 380px) {
      .header-cell {
        height: 214px !important;
        padding-left: 24px !important;
        padding-right: 24px !important;
      }

      .header-title {
        font-size: 20px !important;
      }

      .character {
        width: 148px !important;
        right: 18px !important;
        bottom: 0 !important;
      }

      .content-cell {
        padding-left: 20px !important;
        padding-right: 20px !important;
      }
    }
  </style>
</head>
<body style="margin:0; padding:0; background:#ffffff;">
  <div style="display:none; max-height:0; overflow:hidden; opacity:0; mso-hide:all;">
    퀴켓 이메일 인증코드를 확인해주세요.
  </div>

  <center style="width:100%; background:#ffffff;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%; background:#ffffff;">
      <tr>
        <td align="center" style="padding:0;">
          <table role="presentation" class="email-container" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:600px; margin:0 auto; background:#ffffff;">
            <tr>
              <td class="header-cell" style="position:relative; height:240px; padding:70px 40px 0 40px; background:#fdf9ee; border-bottom:8px solid #ff7f32; overflow:hidden;">
                <img class="logo" src="https://quiket.co.kr/images/mail/logo.png" width="65" height="20" alt="Quiket" style="width:65px; height:20px; display:block; margin:0 0 20px 0;">
                <div class="header-title" style="font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Arial, sans-serif; font-size:26px; line-height:1.3; letter-spacing:-0.8px; font-weight:800; color:#2d1f1d; white-space:nowrap; mso-line-height-rule:exactly;">
                  {{title}}
                </div>
                <img class="character" src="https://quiket.co.kr/images/mail/character.png" width="215" height="148" alt="Quiket character" style="position:absolute; right:47px; bottom:0; width:215px; height:148px; display:block;">
              </td>
            </tr>

            <tr>
              <td class="content-cell" align="center" style="padding:38px 40px 56px 40px; background:#ffffff;">
                <div class="body-text" style="margin:0; font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Arial, sans-serif; font-size:16px; line-height:1.65; letter-spacing:-0.3px; font-weight:600; color:#333336; text-align:center; mso-line-height-rule:exactly;">
                  {{description}}
                </div>

                <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="margin:34px auto 0 auto;">
                  <tr>
                    <td class="code-box" align="center" valign="middle" width="210" height="76" style="width:210px; height:76px; background:#f5f5f5; border-radius:10px; text-align:center;">
                      <span class="code-text" style="font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Arial, sans-serif; font-size:28px; line-height:76px; letter-spacing:1px; font-weight:800; color:#2d1f1d; display:inline-block; white-space:nowrap; padding:0 12px;">{{verificationCode}}</span>
                    </td>
                  </tr>
                </table>

                <p class="body-text" style="margin:50px 0 0 0; font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Arial, sans-serif; font-size:16px; line-height:1.65; letter-spacing:-0.3px; font-weight:600; color:#333336; text-align:center; mso-line-height-rule:exactly;">
                  인증코드는 3분이 지나면 만료될 수 있어요.<br>
                  그럼, 퀴켓과 함께 편리하고 유익한 복습 되세요!
                </p>
              </td>
            </tr>

            <tr>
              <td class="footer-cell" style="padding:0 15px 20px 15px; background:#ffffff;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%; border-top:1px solid #f0f0f0;">
                  <tr>
                    <td style="padding:18px 0 0 0; font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Arial, sans-serif; font-size:13px; line-height:1.6; letter-spacing:-0.2px; color:#86878a; text-align:left; mso-line-height-rule:exactly;">
                      본 메일은 발신 전용 메일로, 문의에 대한 회신은 처리되지 않습니다.<br>
                      문의사항이 있으실 경우 퀴켓 앱 내 ‘마이’ &gt; ‘설정’ &gt; ‘문의’를 활용해주세요.<br>
                      © Quiket_F1 All Rights Reserved.
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </center>
</body>
</html>
